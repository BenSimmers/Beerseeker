<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#FFF8E7" stroke="#D4A574" stroke-width="1"/>

  <!-- Compass rose outer ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#8B7355" stroke-width="0.5" opacity="0.6"/>

  <!-- Compass points (N, S, E, W) -->
  <!-- North (red) -->
  <path d="M 16 3 L 14.5 8 L 16 7.5 L 17.5 8 Z" fill="#DC2626" opacity="0.8"/>
  <!-- South -->
  <path d="M 16 29 L 14.5 24 L 16 24.5 L 17.5 24 Z" fill="#8B7355" opacity="0.6"/>
  <!-- East -->
  <path d="M 29 16 L 24 17.5 L 24.5 16 L 24 14.5 Z" fill="#8B7355" opacity="0.6"/>
  <!-- West -->
  <path d="M 3 16 L 8 17.5 L 7.5 16 L 8 14.5 Z" fill="#8B7355" opacity="0.6"/>

  <!-- Beer glass in center -->
  <!-- Glass body -->
  <path d="M 10 10 L 9.5 22 Q 9.5 24 11 24 L 21 24 Q 22.5 24 22.5 22 L 22 10 Z" fill="none" stroke="#F59E0B" stroke-width="1.2"/>

  <!-- Beer fill -->
  <path d="M 10.2 16 L 9.7 22 Q 9.7 23.5 11 23.5 L 21 23.5 Q 22.3 23.5 22.3 22 L 21.8 16 Z" fill="#D97706" opacity="0.7"/>

  <!-- Glass shine -->
  <line x1="11.5" y1="12" x2="11" y2="20" stroke="#FCD34D" stroke-width="0.8" opacity="0.6"/>

  <!-- Foam head -->
  <circle cx="16" cy="10" r="2.5" fill="#FCD34D" opacity="0.9"/>
  <circle cx="13" cy="11" r="1.8" fill="#FCD34D" opacity="0.8"/>
  <circle cx="19" cy="11" r="2" fill="#FCD34D" opacity="0.8"/>

  <!-- Handle -->
  <path d="M 22 13 Q 25 16 22 19" fill="none" stroke="#F59E0B" stroke-width="1" stroke-linecap="round"/>
</svg>